[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# `compression-gzip` only, deliberately not brotli: br compresses better but
# its cost on a 2.3 MB body is far less predictable, and this server has 2
# vCPUs shared with the SGP4 propagation that produces that body. gzip is
# universally supported and measured 3.5x here.
tower-http = { version = "0.5", features = ["fs", "compression-gzip"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
csv = "1"
dotenvy = "0.15"
# Gzip for the App Storage snapshot (see src/snapshot). Default features mean
# the pure-Rust miniz_oxide backend, so this adds no system library to link
# and nothing to install in replit.nix. A vacuumed database compresses to
# roughly a quarter of its size, which is the difference between a few hundred
# MB and tens of GB of App Storage bandwidth per month.
flate2 = "1"
sgp4 = "2.4"
# Pulled in transitively by sgp4 (for TLE/OMM epoch handling); declared
# directly here too since a transitive dependency isn't `use`-able on its own,
# and enabled with `serde` so satellite response timestamps derive `Serialize`.
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
insta = { version = "1.39", features = ["json"] }
